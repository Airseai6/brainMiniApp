name: Resolve secret scanning alerts

on:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Mark AppID findings as false positive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/secret-scanning/alerts?state=open" > alerts.json
          jq -r '.[].number' alerts.json | while read -r id; do
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/secret-scanning/alerts/${id}" \
              -f state=resolved \
              -f resolution=false_positive
          done
